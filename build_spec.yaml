version: 0.1
component: build
timeoutInSeconds: 200
shell: bash
failImmediatelyOnError: false

env:
  exportedVariables:
    - timestamp

steps:
  - type: Command
    name: "Set timestamp"
    timeoutInSeconds: 30
    command: |
      export timestamp=$(date +%Y%m%d%H%M%S)
      echo "timestamp=$timestamp"

  - type: Command
    name: "Verify and Run"
    timeoutInSeconds: 300
    command: |
      set +e

      find "${OCI_PRIMARY_SOURCE_DIR}" -iname "*gmud*"
      ls -ltr

      echo "========================================"
      echo "Identificando arquivos alterados"
      echo "========================================"

      echo "Commit atual:"
      echo "${OCI_TRIGGER_COMMIT_HASH:-NOT_DEFINED}"

      exit 0

outputArtifacts:
  - name: gmud-sql-file
    type: BINARY
    location: ${OCI_PRIMARY_SOURCE_DIR}/GMUD-1.sql
