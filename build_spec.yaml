version: 0.1
component: build
timeoutInSeconds: 600
shell: bash
failImmediatelyOnError: false

env:
  exportedVariables:
    - number
    - gmud_type

steps:
  - type: Command
    name: "Get GMUD number and type"
    timeoutInSeconds: 30
    command: |
      set -e

      echo "======================================"
      echo "Identificando arquivo da GMUD"
      echo "======================================"

      echo "Commit atual:"
      git rev-parse HEAD

      if [ "$(git rev-parse --is-shallow-repository)" == "true" ]; then
        echo "Repositório clonado como shallow — buscando histórico adicional..."
        git fetch --unshallow --no-tags 2>&1 || echo "AVISO: unshallow falhou ou já havia histórico suficiente."
      fi

      echo "Arquivos alterados no merge (comparando com HEAD^1):"
      git diff --name-only HEAD^1 HEAD

      LAST_ADDED_FILE=$(git diff --name-only HEAD^1 HEAD | grep -iE '^gmud/(DDL|DML)/' | head -n 1)

      echo "Arquivo GMUD encontrado: ${LAST_ADDED_FILE}"

      if [ -z "${LAST_ADDED_FILE}" ]; then
        echo "ERRO: Nenhum arquivo encontrado em gmud/DDL ou gmud/DML."
        exit 1
      fi

      gmud_type=$(echo "${LAST_ADDED_FILE}" | awk -F'/' '{print toupper($2)}')

      if [ "${gmud_type}" != "DDL" ] && [ "${gmud_type}" != "DML" ]; then
        echo "ERRO: Tipo de GMUD inválido: ${gmud_type}"
        exit 1
      fi

      number=$(basename "${LAST_ADDED_FILE}" | grep -oE '[0-9]+' | head -n 1)

      if [ -z "${number}" ]; then
        echo "ERRO: Não foi possível identificar o número da GMUD."
        echo "Arquivo: ${LAST_ADDED_FILE}"
        exit 1
      fi

      # Checa no histórico se essa GMUD já foi processada antes, ANTES de
      # seguir pros steps de validação/empacotamento/deliver artifact.
      if [ -n "${HISTORY_BUCKET}" ]; then
        if oci os object head \
            --bucket-name "${HISTORY_BUCKET}" \
            --name "gmud/history/${number}.json" >/dev/null 2>&1; then
          echo "ERRO: GMUD ${number} já foi processada anteriormente."
          echo "Detalhes em: gmud/history/${number}.json (bucket ${HISTORY_BUCKET})"
          echo "Se isso for intencional (reenvio da mesma GMUD após correção),"
          echo "apague o objeto do histórico antes de reenviar."
          exit 1
        fi
      else
        echo "AVISO: HISTORY_BUCKET não definido — sem checagem de GMUDs já processadas."
      fi

      export number
      export gmud_type

      echo "======================================"
      echo "GMUD identificada com sucesso"
      echo "======================================"
      echo "Arquivo : ${LAST_ADDED_FILE}"
      echo "Número  : ${number}"
      echo "Tipo    : ${gmud_type}"
      echo "======================================"

  - type: Command
    name: "Validate GMUD Header"
    timeoutInSeconds: 30
    command: |
      set -e

      LAST_ADDED_FILE=$(git diff --name-only HEAD^1 HEAD | grep -iE '^gmud/(DDL|DML)/' | head -n 1)

      echo "Validando cabeçalho de metadados do script..."

      if [ "${gmud_type}" == "DDL" ]; then
        if ! grep -qP '^--\s*OBJECT_TYPE:\s*\S+' "${LAST_ADDED_FILE}"; then
          echo "ERRO: Script DDL sem cabeçalho '-- OBJECT_TYPE: <TIPO>'."
          echo "Todo script DDL de GMUD precisa iniciar com:"
          echo "  -- OBJECT_TYPE: TABLE"
          echo "  -- OBJECT_NAME: SCHEMA.NOME_OBJETO"
          exit 1
        fi
        if ! grep -qP '^--\s*OBJECT_NAME:\s*\S+' "${LAST_ADDED_FILE}"; then
          echo "ERRO: Script DDL sem cabeçalho '-- OBJECT_NAME: <SCHEMA.OBJETO>'."
          exit 1
        fi
        echo "Cabeçalho de metadados OK."
      else
        echo "Tipo DML — cabeçalho de metadados não obrigatório."
      fi

  - type: Command
    name: "Verify and Package Artifact"
    timeoutInSeconds: 300
    command: |
      set -e

      echo "======================================"
      echo "Preparando artifact"
      echo "======================================"

      echo "Número da GMUD: ${number}"
      echo "Tipo da GMUD: ${gmud_type}"

      LAST_ADDED_FILE=$(git diff --name-only HEAD^1 HEAD | grep -iE '^gmud/(DDL|DML)/' | head -n 1)

      echo "Arquivo selecionado: ${LAST_ADDED_FILE}"

      if [ ! -f "${OCI_PRIMARY_SOURCE_DIR}/${LAST_ADDED_FILE}" ]; then
        echo "ERRO: Arquivo não encontrado:"
        echo "${OCI_PRIMARY_SOURCE_DIR}/${LAST_ADDED_FILE}"
        exit 1
      fi

      cp "${OCI_PRIMARY_SOURCE_DIR}/${LAST_ADDED_FILE}" \
         "${OCI_PRIMARY_SOURCE_DIR}/target_gmud.sql"

      echo "======================================"
      echo "Artifact gerado"
      echo "======================================"
      ls -lh "${OCI_PRIMARY_SOURCE_DIR}/target_gmud.sql"
      echo "Tipo: ${gmud_type}"
      echo "GMUD: ${number}"

  - type: Command
    name: "Register GMUD History"
    timeoutInSeconds: 30
    command: |
      set -e

      if [ -z "${HISTORY_BUCKET}" ]; then
        echo "AVISO: HISTORY_BUCKET não definido — histórico não registrado."
        exit 0
      fi

      COMMIT_SHA=$(git rev-parse HEAD)
      TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)

      cat > /tmp/history_entry.json <<JSONEOF
      {"number":"${number}","gmud_type":"${gmud_type}","commit":"${COMMIT_SHA}","registered_at":"${TIMESTAMP}"}
      JSONEOF

      oci os object put \
        --bucket-name "${HISTORY_BUCKET}" \
        --name "gmud/history/${number}.json" \
        --file /tmp/history_entry.json \
        --force

      echo "Histórico registrado: gmud/history/${number}.json"

outputArtifacts:
  - name: gmud-sql-file
    type: BINARY
    location: ${OCI_PRIMARY_SOURCE_DIR}/target_gmud.sql
