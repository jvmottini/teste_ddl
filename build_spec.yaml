version: 0.1
component: build
timeoutInSeconds: 600
shell: bash
failImmediatelyOnError: true

steps:

  - type: Command
    name: "Read GMUD-1.txt"
    command: |
      echo "======================================"
      echo "VALIDANDO GMUD-1.TXT"
      echo "======================================"

      echo "Diretório atual:"
      pwd

      echo "Arquivos disponíveis:"
      ls -lah

      GMUD="${OCI_PRIMARY_SOURCE_DIR}/GMUD-1.txt"

      echo "Arquivo esperado:"
      echo "${GMUD}"

      if [ ! -f "${GMUD}" ]; then
        echo "ERRO: GMUD-1.txt não encontrado."
        exit 10
      fi

      if [ ! -s "${GMUD}" ]; then
        echo "ERRO: GMUD-1.txt está vazio."
        exit 11
      fi

      echo ""
      echo "Conteúdo da GMUD:"
      echo "--------------------------------------"

      cat "${GMUD}"

      echo "--------------------------------------"
      echo "GMUD encontrada e validada com sucesso."

outputArtifacts:

  - name: GMUD-2
    type: BINARY
    location: ${OCI_PRIMARY_SOURCE_DIR}/GMUD-2.txt
