version: 0.1
component: build
timeoutInSeconds: 600
shell: bash
failImmediatelyOnError: false

env:
  exportedVariables:
    - timestamp
    - LAST_ADDED_FILE

steps:
  - type: Command
    name: "Set timestamp"
    timeoutInSeconds: 30
    command: |
      export timestamp=$(date +%Y%m%d%H%M%S)
      echo "timestamp=$timestamp"

  - type: Command
    name: "Verify and Run"
    timeoutInSeconds: 300
    command: |
      set +e

      find "${OCI_PRIMARY_SOURCE_DIR}" -iname "*gmud*"
      ls -ltr

      LAST_ADDED_FILE=$(git log -1 --diff-filter=A --name-only --pretty=format:"" | head -n 1)
      echo "Último arquivo adicionado: $LAST_ADDED_FILE"
      
      if [ -n "$LAST_ADDED_FILE" ] && [ -f "$LAST_ADDED_FILE" ]; then
        cp "$LAST_ADDED_FILE" "${OCI_PRIMARY_SOURCE_DIR}/target_gmud.sql"
      else
        echo "Aviso: Nenhum arquivo novo encontrado."
      fi

      echo "Commit atual:"
      export LAST_ADDED_FILE

      exit 0

outputArtifacts:
  - name: gmud-sql-file
    type: BINARY
    location: ${OCI_PRIMARY_SOURCE_DIR}/target_gmud.sql
